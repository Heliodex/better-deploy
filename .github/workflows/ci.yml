name: CI

on:
    push:
        branches: [main]
    pull_request:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    deps:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-go@v7
              with:
                  go-version-file: wt/supervisor/go.mod
                  cache-dependency-path: |
                      wt/supervisor/go.sum
                      wt/deploy/go.sum

            - name: Check Go vulnerabilities
              run: |
                  (cd wt/supervisor && go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...)
                  (cd wt/deploy && go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...)

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.4.4

            - name: Audit admin and guestbook dependencies
              run: |
                  (cd wt/supervisor/web && bun audit --production --audit-level=moderate)
                  (cd wt/example/guestbook/web && bun audit --production --audit-level=moderate)

    lint:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-go@v7
              with:
                  go-version-file: wt/supervisor/go.mod
                  cache-dependency-path: |
                      wt/supervisor/go.sum
                      wt/deploy/go.sum
                      wt/example/go.sum
                      wt/packages/go.sum

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.4.4

            - name: Generate WASI bindings
              working-directory: wt/packages
              run: ./generate.sh

            - name: Install example web dependencies
              run: |
                  (cd wt/example/guestbook/web && bun install --frozen-lockfile)
                  (cd wt/example/pulse/web && bun install --frozen-lockfile)

            - name: Generate example contracts
              run: |
                  (cd wt/example/guestbook && go generate ./contract/)
                  (cd wt/example/pulse && go generate ./contract/)

            - name: Build embedded admin panel
              working-directory: wt/supervisor
              run: go generate ./...

            - name: Install golangci-lint
              run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0

            - name: Lint every module
              run: ./wt/lint.sh

    e2e:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-go@v7
              with:
                  go-version-file: wt/supervisor/go.mod
                  cache-dependency-path: |
                      wt/supervisor/go.sum
                      wt/deploy/go.sum
                      wt/example/go.sum
                      wt/packages/go.sum

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.4.4

            - name: Build embedded admin panel
              working-directory: wt/supervisor
              run: go generate ./...

            - name: Install wasmtime
              run: |
                  curl -fsSL https://github.com/bytecodealliance/wasmtime/releases/download/v50.0.0/wasmtime-v50.0.0-x86_64-linux.tar.xz | tar -xJ
                  echo "$PWD/wasmtime-v50.0.0-x86_64-linux" >> "$GITHUB_PATH"

            - name: Run end-to-end test
              env:
                  WT_E2E_EXAMPLES: "1"
              run: WT_WASMTIME="$(command -v wasmtime)" bash wt/e2e.sh

    test:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-go@v7
              with:
                  go-version-file: wt/supervisor/go.mod
                  cache-dependency-path: |
                      wt/supervisor/go.sum
                      wt/deploy/go.sum
                      wt/example/go.sum
                      wt/packages/go.sum

            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.4.4

            - name: Generate WASI bindings
              working-directory: wt/packages
              run: ./generate.sh

            - name: Build embedded admin panel
              working-directory: wt/supervisor
              run: go generate ./...

            - name: Install guestbook web dependencies
              working-directory: wt/example/guestbook/web
              run: bun install --frozen-lockfile

            - name: Check namespace test support
              run: |
                  if unshare -Ur -m sh -c 'mount --make-rprivate /' 2>/dev/null; then
                      echo "WT_NS_TEST=1" >> "$GITHUB_ENV"
                  else
                      echo "namespace integration test skipped: unprivileged mount namespaces are unavailable"
                  fi

            - name: Test supervisor
              working-directory: wt/supervisor
              env:
                  WT_HANDOVER_TEST: "1"
                  WT_SECCOMP_TEST: "1"
              run: go test -race -count=1 -covermode=atomic -coverprofile=coverage.out ./...

            - name: Test deploy tool
              working-directory: wt/deploy
              env:
                  WT_VITE_TEST: "1"
              run: go test -race -count=1 -covermode=atomic -coverprofile=coverage.out ./...

            - name: Test shared packages
              working-directory: wt/packages
              run: go test -race -count=1 -covermode=atomic -coverprofile=coverage.out ./app/... ./storage/... ./httpmeta/...

            - name: Summarize Go coverage
              if: always()
              run: |
                  {
                      echo "### Go coverage"
                      echo
                      echo "| Scope | Statements |"
                      echo "| --- | ---: |"
                      for entry in "supervisor=wt/supervisor/coverage.out" "deploy=wt/deploy/coverage.out" "packages=wt/packages/coverage.out"; do
                          name=${entry%%=*}
                          file=${entry#*=}
                          if [ ! -s "$file" ]; then
                              echo "| $name | not measured |"
                              continue
                          fi
                          total=$(cd "$(dirname "$file")" && go tool cover -func="$(basename "$file")" | tail -n 1 | awk '{print $3}')
                          echo "| $name | $total |"
                      done
                  } >> "$GITHUB_STEP_SUMMARY"

            - name: Generate guestbook contract and assets
              working-directory: wt/example/guestbook
              run: |
                  go generate ./...
                  (cd web && bun run build)
                  rm -rf static
                  cp -r web/build static

            - name: Vet host packages
              run: |
                  (cd wt/supervisor && go vet ./...)
                  (cd wt/deploy && go vet ./...)

            - name: Vet component packages
              env:
                  GOOS: wasip1
                  GOARCH: wasm
              run: |
                  (cd wt/packages && go vet ./app/... ./storage/... ./wasihttp/...)
                  (cd wt/example && go vet ./...)

            - name: Check admin frontend
              working-directory: wt/supervisor/web
              run: |
                  bun run contract:check
                  bun run svelte:check

            - name: Check guestbook frontend
              working-directory: wt/example/guestbook/web
              run: bun run svelte:check

            - name: Check scaffold frontend
              working-directory: wt/deploy/testdata/template/web
              run: |
                  bun install --frozen-lockfile
                  bun run svelte:check
                  bun run build
