version: "2"

run:
    timeout: 5m
    tests: true

linters:
    default: standard
    enable:
        - bodyclose
        - copyloopvar
        - durationcheck
        - errname
        - errorlint
        - forcetypeassert
        - gocheckcompilerdirectives
        - gocritic
        - makezero
        - mirror
        - nolintlint
        - prealloc
        - reassign
        - rowserrcheck
        - sqlclosecheck
        - thelper
        - unconvert
        - unparam
        - usestdlibvars
        - wastedassign
    exclusions:
        generated: lax
        presets:
            - common-false-positives
            - std-error-handling
        rules:
            - path: (^|/)binding/
              text: .
            - linters:
                  - bodyclose
              path: _test\.go
            - linters:
                  - unparam
              path: _test\.go
    settings:
        gocritic:
            enabled-tags:
                - diagnostic
                - performance
            disabled-checks:
                - badCall
                - evalOrder
                - hugeParam
                - mapKey
                - rangeValCopy
                - sprintfQuotedString
        nolintlint:
            require-explanation: true
            require-specific: true

output:
    formats:
        text:
            path: stdout
            colors: true
            print-linter-name: true
            print-issued-lines: true
