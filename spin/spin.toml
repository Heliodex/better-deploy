#:schema https://schemas.spinframework.dev/spin/manifest-v2/latest.json

spin_manifest_version = 2

[application]
name = "gotime"
version = "0.1.0"
authors = ["Lewin Kelly <heli@odex.cf>"]
description = ""

[[trigger.http]]
route = "/..."
component = "gotime"

[component.gotime]
source = "main.wasm"
allowed_outbound_hosts = []

# For HMR, run `bun run dev` in frontend/ and then `spin up -e vite_dev_server=http://localhost:5173`.
[component.gotime.build]
command = "cd frontend && bun install && bun run build && cd .. && go tool componentize-go build"
watch = ["**/*.go", "go.mod", "app.html", "frontend/src/**", "frontend/package.json", "frontend/vite.config.ts", "frontend/svelte.config.js", "frontend/tsconfig.json"]
