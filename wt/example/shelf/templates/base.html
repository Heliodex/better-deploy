<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta content="width=device-width, initial-scale=1" name="viewport">
		<title>{{.Title}}</title>
		<style>
		:root {
			--paper: #f2eee5;
			--paper-deep: #e8e1d3;
			--card: #fffdf8;
			--ink: #1e2527;
			--muted: #70766f;
			--line: #dcd4c4;
			--accent: #ad431f;
			--accent-deep: #8e3317;
			--accent-soft: #f5dfd4;
			--teal: #226464;
			--teal-soft: #dfeceb;
			--shadow: 0 14px 34px rgba(60, 45, 20, 0.08);
			--radius: 16px;
		}
		* {
			box-sizing: border-box;
		}
		html {
			scroll-behavior: smooth;
		}
		body {
			margin: 0;
			font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
			line-height: 1.5;
			color: var(--ink);
			background: var(--paper);
		}
		a {
			color: var(--accent);
			text-decoration: none;
		}
		a:hover {
			text-decoration: underline;
		}
		button,
		input {
			font: inherit;
		}
		button {
			cursor: pointer;
		}
		.shell {
			width: min(1120px, calc(100% - 36px));
			margin: 0 auto;
		}
		.top {
			display: flex;
			flex-wrap: wrap;
			gap: 24px;
			align-items: flex-end;
			justify-content: space-between;
			padding: 30px 0 18px;
			border-bottom: 1px solid var(--line);
		}
		.brand {
			font-size: 1.65rem;
			font-weight: 800;
			color: var(--ink);
			letter-spacing: -0.045em;
		}
		.brand span {
			color: var(--accent);
		}
		.tagline {
			margin-top: 2px;
			font-size: 0.88rem;
			color: var(--muted);
		}
		.top-note {
			font-size: 0.76rem;
			color: var(--muted);
			text-transform: uppercase;
			letter-spacing: 0.12em;
		}
		main {
			padding: 28px 0 70px;
		}
		h1,
		h2,
		h3 {
			margin: 0;
			line-height: 1.15;
			letter-spacing: -0.025em;
		}
		h1 {
			max-width: 720px;
			font-size: clamp(2rem, 5vw, 3.4rem);
		}
		h2 {
			font-size: 1.15rem;
		}
		p {
			margin: 0;
		}
		.hero {
			display: flex;
			flex-wrap: wrap;
			gap: 24px;
			align-items: flex-end;
			justify-content: space-between;
			margin-bottom: 26px;
		}
		.hero p {
			max-width: 620px;
			margin-top: 10px;
			color: var(--muted);
		}
		.stats {
			display: flex;
			flex-wrap: wrap;
			gap: 8px;
		}
		.stat {
			padding: 7px 13px;
			font-size: 0.78rem;
			color: var(--muted);
			background: var(--card);
			border: 1px solid var(--line);
			border-radius: 999px;
		}
		.stat strong {
			font-variant-numeric: tabular-nums;
			color: var(--ink);
		}
		.flash {
			padding: 11px 14px;
			margin-bottom: 16px;
			font-size: 0.9rem;
			border: 1px solid;
			border-radius: 12px;
		}
		.flash.success {
			color: #174b4b;
			background: var(--teal-soft);
			border-color: #b9d8d5;
		}
		.flash.error {
			color: #7d2a12;
			background: #fbe4de;
			border-color: #edc0b4;
		}
		.add {
			padding: 20px;
			margin-bottom: 26px;
			background: var(--card);
			border: 1px solid var(--line);
			border-radius: var(--radius);
			box-shadow: var(--shadow);
		}
		.add-head {
			display: flex;
			flex-wrap: wrap;
			gap: 16px;
			align-items: baseline;
			justify-content: space-between;
			margin-bottom: 14px;
		}
		.add-head span {
			font-size: 0.8rem;
			color: var(--muted);
		}
		.form-grid {
			display: grid;
			grid-template-columns: 2fr 1.4fr 1fr;
			gap: 10px 12px;
			align-items: end;
		}
		.field {
			display: flex;
			flex-direction: column;
			gap: 5px;
		}
		.field.wide {
			grid-column: span 2;
		}
		.field span {
			font-size: 0.72rem;
			color: var(--muted);
			text-transform: uppercase;
			letter-spacing: 0.09em;
		}
		.field input {
			width: 100%;
			padding: 10px 12px;
			color: var(--ink);
			outline: none;
			background: #fff;
			border: 1px solid var(--line);
			border-radius: 10px;
		}
		.field input:focus {
			border-color: var(--accent);
			box-shadow: 0 0 0 3px var(--accent-soft);
		}
		.primary,
		.secondary,
		.danger {
			padding: 10px 15px;
			font-size: 0.85rem;
			font-weight: 700;
			border: 0;
			border-radius: 10px;
		}
		.primary {
			color: #fff;
			background: var(--accent);
		}
		.primary:hover {
			text-decoration: none;
			background: var(--accent-deep);
		}
		.secondary {
			color: var(--ink);
			background: var(--paper-deep);
		}
		.danger {
			padding: 7px 11px;
			color: #9b2f1a;
			background: transparent;
			border: 1px solid #e2b5a8;
		}
		.danger:hover {
			background: #fbe4de;
		}
		.toolbar {
			display: flex;
			flex-wrap: wrap;
			gap: 12px;
			align-items: center;
			margin-bottom: 22px;
		}
		.search {
			display: flex;
			flex: 1 1 340px;
			gap: 8px;
		}
		.search input {
			flex: 1;
			padding: 11px 16px;
			outline: none;
			background: var(--card);
			border: 1px solid var(--line);
			border-radius: 999px;
		}
		.search input:focus {
			border-color: var(--accent);
			box-shadow: 0 0 0 3px var(--accent-soft);
		}
		.search button {
			padding: 0 18px;
			font-weight: 650;
			background: var(--card);
			border: 1px solid var(--line);
			border-radius: 999px;
		}
		.clear {
			font-size: 0.82rem;
			color: var(--muted);
		}
		.columns {
			display: grid;
			grid-template-columns: 190px minmax(0, 1fr);
			gap: 26px;
			align-items: start;
		}
		.tags-panel {
			position: sticky;
			top: 18px;
		}
		.tags-panel h2 {
			margin-bottom: 10px;
			font-size: 0.74rem;
			color: var(--muted);
			text-transform: uppercase;
			letter-spacing: 0.12em;
		}
		.tag-list {
			display: flex;
			flex-wrap: wrap;
			gap: 7px;
		}
		.tag-item {
			display: inline-flex;
			gap: 6px;
			align-items: center;
			padding: 4px 9px;
			font-size: 0.76rem;
			color: var(--ink);
			background: var(--card);
			border: 1px solid var(--line);
			border-radius: 999px;
		}
		.tag-item span {
			font-variant-numeric: tabular-nums;
			color: var(--muted);
		}
		.tag-item:hover {
			text-decoration: none;
			border-color: var(--accent);
		}
		.links {
			display: grid;
			gap: 12px;
		}
		.card {
			padding: 17px 18px;
			background: var(--card);
			border: 1px solid var(--line);
			border-radius: var(--radius);
			box-shadow: 0 4px 14px rgba(60, 45, 20, 0.035);
		}
		.card:hover {
			border-color: #cabfa9;
		}
		.card-top {
			display: flex;
			flex-wrap: wrap;
			gap: 10px;
			align-items: baseline;
			justify-content: space-between;
		}
		.card-title {
			font-size: 1.08rem;
			font-weight: 750;
			color: var(--ink);
			letter-spacing: -0.02em;
		}
		.card-title:hover {
			color: var(--accent);
			text-decoration: none;
		}
		.host {
			font-size: 0.74rem;
			color: var(--muted);
		}
		.card p {
			margin-top: 6px;
			font-size: 0.9rem;
			color: var(--muted);
		}
		.chips {
			display: flex;
			flex-wrap: wrap;
			gap: 6px;
			margin-top: 10px;
		}
		.chip {
			display: inline-block;
			padding: 2px 8px;
			font-size: 0.72rem;
			font-weight: 650;
			color: var(--teal);
			background: var(--teal-soft);
			border-radius: 999px;
		}
		.chip:hover {
			text-decoration: none;
			background: #cfe4e2;
		}
		.meta {
			display: flex;
			flex-wrap: wrap;
			gap: 14px;
			align-items: center;
			padding-top: 11px;
			margin-top: 13px;
			font-size: 0.76rem;
			color: var(--muted);
			border-top: 1px dashed var(--line);
		}
		.meta strong {
			font-variant-numeric: tabular-nums;
			color: var(--ink);
		}
		.meta form {
			margin-left: auto;
		}
		.visit {
			font-weight: 700;
		}
		.empty {
			padding: 34px;
			color: var(--muted);
			text-align: center;
			background: var(--card);
			border: 1px dashed var(--line);
			border-radius: var(--radius);
		}
		.pagination {
			display: flex;
			gap: 12px;
			align-items: center;
			justify-content: space-between;
			margin-top: 18px;
			font-size: 0.82rem;
			color: var(--muted);
		}
		.pagination a {
			padding: 7px 12px;
			background: var(--card);
			border: 1px solid var(--line);
			border-radius: 9px;
		}
		.pagination a:hover {
			text-decoration: none;
			border-color: var(--accent);
		}
		.back {
			display: inline-block;
			margin-bottom: 18px;
			font-size: 0.85rem;
			color: var(--muted);
		}
		.detail {
			padding: 26px;
			background: var(--card);
			border: 1px solid var(--line);
			border-radius: var(--radius);
			box-shadow: var(--shadow);
		}
		.detail-head {
			display: flex;
			flex-wrap: wrap;
			gap: 24px;
			justify-content: space-between;
		}
		.eyebrow {
			font-size: 0.74rem;
			color: var(--muted);
			text-transform: uppercase;
			letter-spacing: 0.11em;
		}
		.detail h1 {
			margin-top: 4px;
			font-size: clamp(1.8rem, 4vw, 2.8rem);
		}
		.detail .url {
			margin-top: 8px;
			font-size: 0.86rem;
			color: var(--muted);
			word-break: break-all;
		}
		.detail-stats {
			display: flex;
			gap: 22px;
			align-items: flex-start;
		}
		.detail-stats div {
			display: flex;
			flex-direction: column;
		}
		.detail-stats strong {
			font-size: 1.15rem;
			font-variant-numeric: tabular-nums;
		}
		.detail-stats span {
			font-size: 0.72rem;
			color: var(--muted);
			text-transform: uppercase;
			letter-spacing: 0.08em;
		}
		.description {
			max-width: 760px;
			margin-top: 16px;
			color: var(--muted);
		}
		.detail .chips {
			margin-top: 16px;
		}
		.actions {
			display: flex;
			flex-wrap: wrap;
			gap: 10px;
			align-items: center;
			margin-top: 20px;
		}
		.panel {
			padding: 20px;
			margin-top: 18px;
			background: var(--card);
			border: 1px solid var(--line);
			border-radius: var(--radius);
		}
		.panel h2 {
			margin-bottom: 14px;
		}
		.bars {
			display: flex;
			gap: 5px;
			align-items: flex-end;
			height: 110px;
			padding-top: 8px;
		}
		.bar {
			display: flex;
			flex: 1;
			flex-direction: column;
			gap: 5px;
			align-items: center;
			justify-content: flex-end;
			min-width: 8px;
			height: 100%;
		}
		.bar span {
			display: block;
			width: 100%;
			min-height: 2px;
			background: var(--accent);
			border-radius: 4px 4px 0 0;
		}
		.bar b {
			font-size: 0.66rem;
			font-weight: 700;
			color: var(--ink);
		}
		.bar small {
			font-size: 0.63rem;
			color: var(--muted);
			white-space: nowrap;
		}
		table {
			width: 100%;
			font-size: 0.85rem;
			border-collapse: collapse;
		}
		th,
		td {
			padding: 8px 0;
			text-align: left;
			border-bottom: 1px solid var(--line);
		}
		th {
			font-size: 0.7rem;
			font-weight: 650;
			color: var(--muted);
			text-transform: uppercase;
			letter-spacing: 0.08em;
		}
		tr:last-child td {
			border-bottom: 0;
		}
		@media (max-width: 780px) {
			.columns {
				grid-template-columns: 1fr;
			}
			.tags-panel {
				position: static;
			}
			.form-grid {
				grid-template-columns: 1fr;
			}
			.field.wide {
				grid-column: auto;
			}
			.detail-stats {
				gap: 16px;
			}
		}
		</style>
	</head>
	<body>
		<header class="top shell">
			<div>
				<a class="brand" href="/">Link<span>Shelf</span></a>
				<div class="tagline">A small, searchable shelf for the links worth keeping.</div>
			</div>
			<div class="top-note">wt + wasi:http + sqlite</div>
		</header>
		<main class="shell">{{template "content" .}}</main>
	</body>
</html>
