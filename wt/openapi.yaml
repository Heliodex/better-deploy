    StorageChangesResult:
      type: object
      properties:
        changes:
          type: array
          items:
            type: object
            properties:
              params:
                type: array
                items: {}
              rows:
                type: array
                items:
                  type: object
                  properties:
                    columns:
                      type: array
                      items:
                        type: string
                    new:
                      type: array
                      items: {}
                    old:
                      type: array
                      items: {}
                    op:
                      enum:
                        *enum4
                      type: string
                    rowId:
                      type: integer
                      minimum: 0
                    table:
                      type: string
                      minLength: 1
                  required:
                    - columns
                    - op
                    - table
              rowsAffected:
                type: integer
                minimum: 0
              rowsTruncated:
                type: boolean
              sql:
                type: string
