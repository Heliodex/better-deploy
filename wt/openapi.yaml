components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    AppName:
      name: name
      in: path
      required: true
      schema:
        type: string
    LogLevel:
      name: level
      in: query
      schema:
        type: string
        enum:
          - trace
          - debug
          - info
          - warn
          - error
          - fatal
    LogSource:
      name: source
      in: query
      schema:
        type: string
        enum:
          - app
          - supervisor
    LogQuery:
      name: q
      in: query
      schema:
        type: string
  schemas:
    AppInfo:
      type: object
      properties:
        cpuPercent:
          type: number
          minimum: 0
        currentDigest:
          type: string
        diskBytes:
          type: number
          minimum: 0
        diskLimitBytes:
          type: number
          minimum: 0
        historyBytes:
          type: number
          minimum: 0
        host:
          type: string
          minLength: 1
        lastError:
          type: string
        lastHealthy:
          type: string
        memoryBytes:
          type: number
          minimum: 0
        name:
          type: string
          minLength: 1
        overQuota:
          type: boolean
        pid:
          type: integer
        port:
          type: integer
          minimum: 0
        ready:
          type: boolean
        sampledAt:
          type: string
          minLength: 1
        startedAt:
          type: string
          minLength: 1
        status:
          enum:
            &enum3
            - running
            - stopped
            - unhealthy
            - restarting
          type: string
      required:
        - cpuPercent
        - historyBytes
        - host
        - memoryBytes
        - name
        - port
        - sampledAt
        - startedAt
        - status
      title: AppInfo
    IdentityUser:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        name:
          type: string
        groups:
          type: array
          items:
            type: string
        disabled:
          type: boolean
        createdAt:
          type: string
          format: date-time
    IdentityMe:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/IdentityUser"
        csrfToken:
          type: string
    Event:
      type: object
      properties:
        id:
          type: integer
        topic:
          type: string
        time:
          type: string
          format: date-time
        data: {}
    BlobUploadResponse:
      type: object
      properties:
        digest:
          type: string
        size:
          type: integer
        contentType:
          type: string
        url:
          type: string
        createdAt:
          type: string
          format: date-time
    Deployment:
      type: object
      properties:
        bytes:
          type: number
          minimum: 0
        current:
          type: boolean
        deployedAt:
          type: string
          minLength: 1
        digest:
          type: string
        error:
          type: string
        id:
          type: string
          minLength: 1
        rebuildable:
          type: boolean
        runtime:
          type: string
        size:
          type: number
          minimum: 0
        status:
          enum:
            - success
            - failed
          type: string
        target:
          type: string
      required:
        - bytes
        - deployedAt
        - digest
        - id
        - rebuildable
        - size
      title: Deployment
    JobRequest:
      type: object
      required:
        - path
      properties:
        path:
          type: string
          pattern: ^/
        method:
          type: string
          enum:
            - GET
            - POST
            - PUT
            - PATCH
            - DELETE
          default: POST
        body:
          type: string
        headers:
          type: object
          additionalProperties:
            type: string
        runAt:
          type: string
          format: date-time
        maxAttempts:
          type: integer
          minimum: 1
          maximum: 20
          default: 3
        idempotencyKey:
          type: string
    Blob:
      type: object
      properties:
        digest:
          type: string
        size:
          type: integer
        contentType:
          type: string
        createdAt:
          type: string
    Job:
      type: object
      properties:
        id:
          type: string
        path:
          type: string
        method:
          type: string
        status:
          type: string
        attempts:
          type: integer
        maxAttempts:
          type: integer
        runAt:
          type: string
          format: date-time
        lastError:
          type: string
        statusCode:
          type: integer
    AppConfig:
      type: object
      properties:
        allow_callers:
          type: array
          items:
            type: string
        disk_mb:
          type: number
          minimum: 0
        egress:
          type: array
          items:
            type: object
            properties:
              cidr:
                type: string
                minLength: 1
              port:
                type: integer
                minimum: 1
            required:
              - cidr
              - port
        env_keys:
          type: array
          items:
            type: string
        secret_keys:
          type: array
          items:
            type: string
        health:
          type: string
          minLength: 1
        health_failures:
          type: number
          minimum: 1
        health_interval:
          type: string
        host:
          type: string
          minLength: 1
        job_concurrency:
          type: number
          minimum: 1
        hosts:
          type: array
          items:
            type: string
        max_concurrency:
          type: number
          minimum: 0
        memory_mb:
          type: number
          minimum: 0
        name:
          type: string
          minLength: 1
        network:
          enum:
            - inherit
            - none
            - storage
          type: string
        request_timeout:
          type: string
        restart_on_unhealthy:
          type: boolean
        restart_required:
          type: boolean
        schedule:
          type: array
          items: {}
        startup_timeout:
          type: string
      required:
        - allow_callers
        - disk_mb
        - egress
        - env_keys
        - health
        - health_failures
        - health_interval
        - host
        - job_concurrency
        - hosts
        - max_concurrency
        - memory_mb
        - name
        - network
        - request_timeout
        - restart_on_unhealthy
        - schedule
        - startup_timeout
      title: AppConfig
    BackupInfo:
      type: object
      properties:
        createdAt:
          type: string
          minLength: 1
        dataSize:
          type: number
          minimum: 0
        hasData:
          type: boolean
        kind:
          enum:
            &enum
            - auto
            - import
            - manual
            - ""
          type: string
        name:
          type: string
          minLength: 1
        parent:
          type: string
        size:
          type: number
          minimum: 0
      required:
        - createdAt
        - kind
        - name
        - parent
        - size
      title: BackupInfo
    BackupSettings:
      type: object
      properties:
        enabled:
          type: boolean
        every:
          type: string
          minLength: 1
        keep:
          type: integer
          minimum: 1
      required:
        - enabled
        - every
        - keep
      title: BackupSettings
    BackupsResult:
      type: object
      properties:
        backups:
          type: array
          items:
            type: object
            properties:
              createdAt:
                type: string
                minLength: 1
              dataSize:
                type: number
                minimum: 0
              hasData:
                type: boolean
              kind:
                enum:
                  *enum
                type: string
              name:
                type: string
                minLength: 1
              parent:
                type: string
              size:
                type: number
                minimum: 0
            required:
              - createdAt
              - kind
              - name
              - parent
              - size
        created:
          type: string
        current:
          type: string
        database:
          type: boolean
        settings:
          type: object
          properties:
            enabled:
              type: boolean
            every:
              type: string
              minLength: 1
            keep:
              type: integer
              minimum: 1
          required:
            - enabled
            - every
            - keep
      required:
        - backups
        - current
        - database
        - settings
      title: BackupsResult
    DatabaseOverview:
      type: object
      properties:
        database:
          type: boolean
        tables:
          type: array
          items:
            type: string
        version:
          type: number
          minimum: 0
        stats:
          type: array
          items:
            type: object
            properties:
              bytes:
                type: number
                minimum: 0
              name:
                type: string
                minLength: 1
              rows:
                type: number
                minimum: 0
            required:
              - bytes
              - name
              - rows
      required:
        - database
        - tables
        - version
      title: DatabaseOverview
    DatabaseRows:
      type: object
      properties:
        columns:
          type: array
          items:
            type: string
        limit:
          type: integer
          minimum: 1
        offset:
          type: integer
          minimum: 0
        rows:
          type: array
          items:
            type: array
            items: {}
        table:
          type: string
          minLength: 1
        total:
          type: integer
          minimum: 0
        truncated:
          type: boolean
      required:
        - columns
        - limit
        - offset
        - rows
        - table
        - total
        - truncated
      title: DatabaseRows
    DatabaseTableStat:
      type: object
      properties:
        bytes:
          type: number
          minimum: 0
        name:
          type: string
          minLength: 1
        rows:
          type: number
          minimum: 0
      required:
        - bytes
        - name
        - rows
      title: DatabaseTableStat
    DeploymentRun:
      type: object
      properties:
        digest:
          type: string
        error:
          type: string
        id:
          type: string
          minLength: 1
        mode:
          type: string
        status:
          enum:
            - queued
            - running
            - success
            - failed
            - canceled
          type: string
      required:
        - digest
        - id
        - status
      title: DeploymentRun
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
      title: ErrorResponse
    LogEntry:
      type: object
      properties:
        level:
          enum:
            &enum1
            - trace
            - debug
            - info
            - warn
            - error
            - fatal
          type: string
        message:
          type: string
        source:
          enum:
            &enum2
            - app
            - supervisor
          type: string
        time:
          type: string
      required:
        - level
        - message
        - source
        - time
      title: LogEntry
    LogsResult:
      type: object
      properties:
        logs:
          type: array
          items:
            type: object
            properties:
              level:
                enum:
                  *enum1
                type: string
              message:
                type: string
              source:
                enum:
                  *enum2
                type: string
              time:
                type: string
            required:
              - level
              - message
              - source
              - time
      required:
        - logs
      title: LogsResult
    ResourceSample:
      type: object
      properties:
        at:
          type: string
          minLength: 1
        cpuPercent:
          type: number
          minimum: 0
        memoryBytes:
          type: number
          minimum: 0
      required:
        - at
        - cpuPercent
        - memoryBytes
      title: ResourceSample
    RowChange:
      type: object
      properties:
        columns:
          type: array
          items:
            type: string
        new:
          type: array
          items: {}
        old:
          type: array
          items: {}
        op:
          enum:
            &enum4
            - insert
            - update
            - delete
          type: string
        rowId:
          type: integer
          minimum: 0
        table:
          type: string
          minLength: 1
      required:
        - columns
        - op
        - table
      title: RowChange
    Snapshot:
      type: object
      properties:
        apps:
          type: array
          items:
            type: object
            properties:
              cpuPercent:
                type: number
                minimum: 0
              currentDigest:
                type: string
              diskBytes:
                type: number
                minimum: 0
              diskLimitBytes:
                type: number
                minimum: 0
              historyBytes:
                type: number
                minimum: 0
              host:
                type: string
                minLength: 1
              lastError:
                type: string
              lastHealthy:
                type: string
              memoryBytes:
                type: number
                minimum: 0
              name:
                type: string
                minLength: 1
              overQuota:
                type: boolean
              pid:
                type: integer
              port:
                type: integer
                minimum: 0
              ready:
                type: boolean
              sampledAt:
                type: string
                minLength: 1
              startedAt:
                type: string
                minLength: 1
              status:
                enum:
                  *enum3
                type: string
            required:
              - cpuPercent
              - historyBytes
              - host
              - memoryBytes
              - name
              - port
              - sampledAt
              - startedAt
              - status
        type:
          const: snapshot
      required:
        - apps
        - type
      title: Snapshot
    StorageChange:
